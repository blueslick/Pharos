# Settings for the entry-admin toolkit. Edit this file, not the Python code.
# Paths are relative to the folder this file is in.

[paths]
csv       = "work/submissions.csv"   # the Tally export
files     = "work/downloads"         # folder of downloaded essays / proofs
tracker   = "work/tracker.xlsx"
templates = "templates"
emails    = "work/emails"
judging   = "work/judging"           # judging/key.xlsx lives here: keep it PRIVATE

[entry]
id_prefix = "ZH"          # entry IDs look like ZH-001
id_digits = 3
word_limit = 800          # flag essays with MORE words than this
min_words_for_text = 20   # fewer words than this in a PDF = treated as a scan
open_max_age = 25         # the Open category is for 25 and under (age on 17 January 2027): older entries get flagged for a manual check
adult_age = 18            # under this age, the entry needs a parent or guardian's email (the form's "Secondary email")

# There is one entry fee, for everyone. If the Tally form still asks for the fee, this line must
# match its answer WORD FOR WORD (only capital letters and extra spaces are ignored), or EVERY entry
# will be flagged "Fee problem: Unclear" until you change it. If the form no longer asks, nothing is checked.
[fees]
full = "MYR 40 (about USD 10 at current FOREX rates)"
# The amount to match on T.A.S.K's bank statement. The fee is MYR 40 (USD is only a guide), and every entrant transfers exactly this in
# ringgit (T.A.S.K's account takes ringgit only), so a payment is found and correct only if it shows this amount.
statement_amount = "MYR 40.00"

# What goes into the email drafts. Placeholders stay in [brackets] until you know them.
[email]
site_name = "Pharos"                    # keep in step with src/site.ts
edition = "Inaugural Edition (SDG 2: Zero Hunger)"
# !! This MUST match CONTACT_EMAIL in src/site.ts (the website, once PR #2 is merged).
# The address is typed in two places, so if you change one, change the other.
contact_email = "pharosprize@gmail.com"
soup_kitchen = "The Assembly Soup Kitchen (T.A.S.K)"
# The payment email says what to transfer and by when. Keep in step with ENTRY_FEE_MYR in src/site.ts and with
# the payment-fix day on the FAQ (the deadline plus PAYMENT_GRACE_DAYS_AFTER_DEADLINE, 7 days: 24 January 2027).
fee_myr = "MYR 40"
payment_fix_by = "24 January 2027"
sign_off = "The student volunteers"

# Column mapping (the Tally form is final; these are its exact question titles): left = the name used by this toolkit (do not change),
# right = the EXACT question title in the Tally CSV. If you rename a question
# in Tally, change the right-hand side here. That is the only fix needed.
[columns]
submission_id   = "Submission ID"      # added by Tally, not a form question
respondent_id   = "Respondent ID"
submitted_at    = "Submitted at"       # added by Tally
full_name       = "Full name"
email           = "Email"
country         = "Country"
school          = "School"
age             = "Age on 17 January 2027"
secondary_email = "Secondary email"    # only shown on the form to under-18s; the form suggests a parent or guardian's address
prompt          = "Which prompt are you answering?"
essay           = "Your essay (PDF)"
fee             = "Your entry fee"
proof           = "Proof of payment"
transfer_ref    = "Transfer reference or transaction ID"
payer_name      = "Name on the account you paid from"
declaration     = "Before you submit"
