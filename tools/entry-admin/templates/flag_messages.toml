# One sentence per payment flag, used in the "payment_not_found" email. Edit the wording freely.
# Only payment problems get an email. Every other flag (word count, PDF problem, name inside the essay,
# age, missing parent email, duplicate entrant, non-Latin name, fee answer) stays an internal flag in
# the tracker and creates no email: an entry that breaks a rule is disqualified and is not emailed.
# Keys are "flagname" or "flagname.subtype". If there is no subtype version, the plain one is used.
# Extra placeholders here: {detail} (technical detail from the tracker), {fee_myr}, {soup_kitchen}.
# These go to the entrant, so do not use {detail} for the duplicate flags (it names other people's entries).

# Raised when "Payment verified (Y/N)" is N: the transfer was not found on T.A.S.K's statement, or the amount was wrong.
payment_not_found = "We could not find a transfer of {fee_myr} for this entry in the account of {soup_kitchen}, or the amount that arrived was not {fee_myr}."

no_proof = "We have not received proof of your payment. Please reply with a screenshot of your bank transfer confirmation."

duplicate_transfer = "The transfer reference you gave has already been used on another entry. Please check it and send us the correct reference for your payment."
